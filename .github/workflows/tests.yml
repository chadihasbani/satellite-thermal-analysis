name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import reportlab, plotly, kaleido, pypdf; print('pdf-deps-ok')"
          # Kaleido static Plotly export (PDF orbital snapshots) needs Chrome.
          # Fail the job if Chrome cannot be obtained — do not hide install errors.
          python -c "import asyncio, kaleido; print('chrome', asyncio.run(kaleido.get_chrome(verbose=True)))"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
